<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatti</title>
</head>

<style>     
    .centrato {
        text-align: center;
    }

    #gatto-casuale {
        /* height: 420px */
        width: 30%;
        border-radius: 40px;
        
    }

    #bottone-ricarica {
        font-size: 24px;
        background-color: blueviolet;
        padding: 6px;
        border-radius: 6px;
    }

    #gatti-salvati{
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
    }

    #gatti-salvati img{
        height: 300;
        
    }
</style>

<body>
    <div class = "centrato">
        <img id= "gatto-casuale" src="" alt="Gatto casuale">
        <button id = "bottone-ricarica">carica gatto</button>
        <button id = "bottone-salva">salva gatto</button>
    </div>

    <div id = "gatti-salvati">
    </div>

    <script>
        const image = document.getElementById("gatto-casuale")
        const bottone = document.getElementById("bottone-ricarica")
        const bottoneSalva = document.getElementById("bottone-salva")
        const salvati = document.getElementById("gatti-salvati")
        
        let arrayGatti = [];

        async function getRandomCat(){
            const url = "https://cataas.com/cat?json=true"
            try{
                const response = await fetch (url)
                console.log(response)
                if(response.ok){
                    const cat = await response.json()
                    console.log(cat)
                    image.src = cat.url;
                }
            } catch(e) {
                console.log(e.message)
            }
        }

        bottoneSalva.addEventListener("click", ()=>{
            arrayGatti.push(image.src)
            renderizzaGatti();

            const nuovoGatto = document.createElement("img");
            salvati.appendChild(nuovoGatto);
        })

        /*
        bottone.addEventListener("click", () => {
            getRandomCat();
        })
        */

        //bottone.addEventListener("click", () => getRandomCat());

        bottone.addEventListener("click", getRandomCat);

        getRandomCat()

        function renderizzaGatti() {
            salvati.innerHTML = "";
            for(let i = 0; i < arrayGatti.length; i++){
                const nuovoGatto = document.createElement("img");
                nuovoGatto.src = arrayGatti[i];
                salvati.appendChild(nuovoGatto);
            }
        }

    </script>
</body>
</html>
